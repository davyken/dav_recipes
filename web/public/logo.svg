      <stop offset="0%" style="stop-color:#8E24AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6A1B9A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGradient)"/>
  
  <!-- Plate -->
  <ellipse cx="100" cy="115" rx="70" ry="55" fill="url(#plateGradient)"/>
  <ellipse cx="100" cy="115" rx="55" ry="42" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Fork (left) -->
  <rect x="35" y="45" width="4" height="50" rx="2" fill="#FFFFFF"/>
  <rect x="32" y="40" width="10" height="3" rx="1" fill="#FFFFFF"/>
  <rect x="32" y="46" width="10" height="3" rx="1" fill="#FFFFFF"/>
  <rect x="32" y="52" width="10" height="3" rx="1" fill="#FFFFFF"/>
  <rect x="32" y="58" width="10" height="3" rx="1" fill="#FFFFFF"/>
  
  <!-- Knife (right) -->
  <rect x="161" y="40" width="4" height="60" rx="2" fill="#FFFFFF"/>
  <path d="M165 95 L175 105 Q178 108 175 115 L168 115 Q165 108 165 100 Z" fill="#FFFFFF"/>
  
  <!-- Steam lines -->
