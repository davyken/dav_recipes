  <path d="M115 30 Q120 25 115 20" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Text: Recipe -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">RECIPE</text>
